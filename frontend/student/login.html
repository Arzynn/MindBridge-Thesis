<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindBridge | Student Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(15, 118, 110, 0.05), rgba(248, 250, 252, 0.96) 25%, #f8fafc 100%);
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
    }
    .login-card {
      width: min(100%, 420px);
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 18px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
    .login-header {
      padding: 28px 28px 18px;
      text-align: center;
      background: linear-gradient(180deg, rgba(15, 118, 110, 0.03), rgba(255, 255, 255, 0.8));
    }
    .brand-lockup {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .brand-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #0f766e, #1e3a8a);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      box-shadow: 0 14px 22px rgba(15, 118, 110, 0.2);
    }
    .brand-name {
      margin: 0;
      font-weight: 800;
      font-size: 1.8rem;
      line-height: 1.1;
      letter-spacing: -0.04em;
      color: #0f172a;
    }
    .brand-subtitle {
      margin: 0;
      color: #475569;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .login-body {
      padding: 0 28px 28px;
    }
    .form-label {
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
      color: #475569;
      margin-bottom: 8px;
    }
    .form-control {
      height: 52px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: #ffffff;
      box-shadow: none;
      color: #0f172a;
      font-size: 0.97rem;
      padding: 0.8rem 0.9rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-control:focus {
      border-color: rgba(15, 118, 110, 0.5);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
      background: #fff;
    }
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      margin-bottom: 18px;
    }
    .form-check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: #475569;
      font-size: 0.9rem;
    }
    .form-check-input {
      width: 16px;
      height: 16px;
      border-color: rgba(148, 163, 184, 0.6);
      margin-top: 0;
    }
    .form-check-input:checked {
      background-color: #0f766e;
      border-color: #0f766e;
    }
    .reset-link, .portal-link {
      color: #0f766e;
      text-decoration: none;
      font-weight: 600;
    }
    .reset-link:hover, .portal-link:hover {
      color: #115e59;
      text-decoration: underline;
    }
    .btn-primary {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0f766e, #115e59);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 16px 25px rgba(15, 118, 110, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 30px rgba(15, 118, 110, 0.24);
      background: linear-gradient(135deg, #0f766e, #115e59);
    }
    .btn-primary:disabled {
      opacity: 0.85;
      cursor: wait;
    }
    .loading-state {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary.is-loading .normal-state {
      display: none;
    }
    .btn-primary.is-loading .loading-state {
      display: inline-flex;
    }
    .spinner-border {
      width: 0.9rem;
      height: 0.9rem;
      border-width: 0.12rem;
    }
    .switcher {
      margin-top: 18px;
      text-align: center;
      color: #475569;
      font-size: 0.9rem;
    }
    .switcher-counselor {
      margin-top: 10px;
    }
    .portal-link {
      font-weight: 700;
    }
    @media (max-width: 420px) {
      .login-header, .login-body {
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="brand-lockup">
        <div class="brand-mark">M</div>
        <h1 class="brand-name">MindBridge</h1>
      </div>
      <p class="brand-subtitle">Student Wellness &amp; Support Portal</p>
    </div>
    <div class="login-body">
      <form id="studentLoginForm" novalidate>
        <div class="mb-3">
          <label for="studentEmail" class="form-label">University Email</label>
          <input type="email" id="studentEmail" class="form-control" placeholder="name@university.edu" required>
        </div>
        <div class="mb-3">
          <label for="studentPassword" class="form-label">Password</label>
          <input type="password" id="studentPassword" class="form-control" placeholder="Enter your password" required>
        </div>
        <div class="options-row">
          <label class="form-check">
            <input class="form-check-input" type="checkbox" checked>
            <span>Remember me</span>
          </label>
          <a href="#" class="reset-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" id="signInButton">
          <span class="normal-state">Sign In</span>
          <span class="loading-state">
            <span class="spinner-border" role="status" aria-hidden="true"></span>
            Signing in...
          </span>
        </button>
      </form>
      <div class="switcher">
        Don't have an account? <a class="portal-link" data-local-href="register.html" href="?page=register">Register here</a>
      </div>
      <div class="switcher switcher-counselor">
        Counselor access? <a class="portal-link" data-local-href="../counselor/login.html" href="?page=counselor_login">Switch to Counselor Portal</a>
      </div>
    </div>
  </div>
  <script>
    const form = document.getElementById('studentLoginForm');
    const button = document.getElementById('signInButton');

    function showAuthError(message) {
      const existing = document.getElementById('studentAuthError');
      if (existing) {
        existing.remove();
      }

      const alertDiv = document.createElement('div');
      alertDiv.id = 'studentAuthError';
      alertDiv.className = 'alert alert-danger mt-3';
      alertDiv.setAttribute('role', 'alert');
      alertDiv.textContent = message;
      form.parentNode.insertBefore(alertDiv, form.nextSibling);
    }

    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      document.querySelectorAll('[data-local-href]').forEach(function (link) {
        link.href = link.dataset.localHref;
      });
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const email = document.getElementById('studentEmail');
      const password = document.getElementById('studentPassword');
      if (!email.value.trim() || !password.value.trim()) {
        email.focus();
        return;
      }

      button.disabled = true;
      button.classList.add('is-loading');

      google.script.run.withSuccessHandler(function (result) {
        button.disabled = false;
        button.classList.remove('is-loading');

        if (result && result.success) {
          sessionStorage.setItem('mindbridge_user', JSON.stringify(result.user));
          if (result.sessionToken) {
            sessionStorage.setItem('mindbridge_session_token', result.sessionToken);
          }
          UI.navigateToPage('student-dashboard');
          return;
        }

        showAuthError((result && result.error) ? result.error : 'Invalid credentials');
      }).withFailureHandler(function (error) {
        button.disabled = false;
        button.classList.remove('is-loading');
        showAuthError(error && error.message ? error.message : 'Unable to sign in right now.');
      }).loginUser(email.value.trim(), password.value, 'STUDENT');
    });
  </script>

</body>
</html>
