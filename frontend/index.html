<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=student/login.html">
  <title>MindBridge | Redirecting</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: linear-gradient(145deg, #ecfeff, #f8fafc 55%, #eff6ff);
    }
    main {
      width: min(100%, 420px);
      padding: 36px 28px;
      box-sizing: border-box;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.1);
    }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 20px;
      border: 4px solid #ccfbf1;
      border-top-color: #0f766e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: #475569;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    a {
      color: #0f766e;
      font-weight: 700;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Redirecting to MindBridge Student Portal...</h1>
    <p>If you are not redirected automatically, <a href="student/login.html">open the Student Portal</a>.</p>
  </main>
</body>
</html>
