<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindBridge | Counselor Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --slate-blue: #1e3a5f; --slate-blue-dark: #172f4d; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; margin: 0; background: #f8fafc; font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif; }
    .login-card { width: min(100%, 430px); overflow: hidden; background: #fff; border: 1px solid rgba(148, 163, 184, 0.16); border-radius: 18px; box-shadow: 0 22px 50px rgba(15, 23, 42, 0.1); }
    .login-header { padding: 32px 28px 26px; text-align: center; color: #fff; background: var(--slate-blue); }
    .brand-mark { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 14px; border-radius: 14px; color: var(--slate-blue); background: #fff; font-size: 1.2rem; font-weight: 800; }
    .brand-name { margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.04em; }
    .brand-subtitle { margin: 8px 0 0; color: #dbeafe; font-size: 0.9rem; }
    .login-body { padding: 28px; }
    .form-label { margin-bottom: 8px; color: #475569; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .form-control { height: 52px; border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 12px; font-size: 0.97rem; }
    .form-control:focus { border-color: rgba(30, 58, 95, 0.55); box-shadow: 0 0 0 4px rgba(30, 58, 95, 0.12); }
    .btn-staff { width: 100%; height: 52px; border: 0; border-radius: 12px; color: #fff; background: linear-gradient(135deg, var(--slate-blue), var(--slate-blue-dark)); box-shadow: 0 14px 24px rgba(30, 58, 95, 0.2); font-weight: 700; }
    .btn-staff:hover { color: #fff; background: linear-gradient(135deg, var(--slate-blue), var(--slate-blue-dark)); }
    .btn-staff:disabled { cursor: wait; opacity: 0.85; }
    .loading-state { display: none; align-items: center; justify-content: center; gap: 8px; }
    .btn-staff.is-loading .normal-state { display: none; }
    .btn-staff.is-loading .loading-state { display: inline-flex; }
    .spinner-border { width: 0.9rem; height: 0.9rem; border-width: 0.12rem; }
    .switcher { margin: 18px 0 0; color: #64748b; font-size: 0.9rem; text-align: center; }
    .switcher a { color: var(--slate-blue); font-weight: 700; text-decoration: none; }
    .switcher a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="login-card">
    <header class="login-header">
      <div class="brand-mark" aria-hidden="true">M</div>
      <h1 class="brand-name">MindBridge</h1>
      <p class="brand-subtitle">Counselor &amp; Admin Portal</p>
    </header>
    <section class="login-body">
      <form id="counselorLoginForm" novalidate>
        <div class="mb-3">
          <label for="staffEmail" class="form-label">Staff Email / Institutional ID</label>
          <input type="text" id="staffEmail" class="form-control" placeholder="staff@university.edu" autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label for="staffPassword" class="form-label">Password</label>
          <input type="password" id="staffPassword" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-staff" id="staffSignInButton">
          <span class="normal-state">Sign In as Staff</span>
          <span class="loading-state"><span class="spinner-border" role="status" aria-hidden="true"></span>Signing in...</span>
        </button>
      </form>
      <p class="switcher">Student? <a href="?page=login">Access Student Portal</a></p>
    </section>
  </main>
  <script>
    const form = document.getElementById('counselorLoginForm');
    const button = document.getElementById('staffSignInButton');

    function showAuthError(message) {
      const existing = document.getElementById('counselorAuthError');
      if (existing) {
        existing.remove();
      }

      const alertDiv = document.createElement('div');
      alertDiv.id = 'counselorAuthError';
      alertDiv.className = 'alert alert-danger mt-3';
      alertDiv.setAttribute('role', 'alert');
      alertDiv.textContent = message;
      form.parentNode.insertBefore(alertDiv, form.nextSibling);
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }

      const email = document.getElementById('staffEmail').value.trim();
      const password = document.getElementById('staffPassword').value;

      button.disabled = true;
      button.classList.add('is-loading');

      google.script.run.withSuccessHandler(function (result) {
        button.disabled = false;
        button.classList.remove('is-loading');

        if (result && result.success) {
          sessionStorage.setItem('mindbridge_user', JSON.stringify(result.user));
          if (result.sessionToken) {
            sessionStorage.setItem('mindbridge_session_token', result.sessionToken);
          }
          UI.navigateToPage('counselor');
          return;
        }

        showAuthError((result && result.error) ? result.error : 'Invalid credentials');
      }).withFailureHandler(function (error) {
        button.disabled = false;
        button.classList.remove('is-loading');
        showAuthError(error && error.message ? error.message : 'Unable to sign in right now.');
      }).loginUser(email, password, 'COUNSELOR');
    });
  </script>
</body>
</html>
